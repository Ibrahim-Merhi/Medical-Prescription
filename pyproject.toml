[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "medical_prescription"
authors = [{name = "Medical Prescription contributors"}]
description = "Medical Prescription for Frappe Healthcare v16"
requires-python = ">=3.14,<3.15"
dynamic = ["version"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
healthcare = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"

[tool.ruff]
target-version = "py39"
line-length = 100

